name: dataviz

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        REQUIREMENTS_FILE: backend/requirements.txt
    env_file:
      - .env.dev
    ports:
      - "127.0.0.1:${BACKEND_PORT:-6500}:${BACKEND_PORT:-6500}"
    volumes:
      - ./backend/data:/app/data
    environment:
      - FLASK_ENV=production
      - HOST=0.0.0.0
      - FLASK_PORT=${BACKEND_PORT:-6500}
      - SUMMARY_ENABLED=${SUMMARY_ENABLED:-true}
    restart: always

  frontend:
    build:
      context: ./frontend
    env_file:
      - .env.dev
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: always
